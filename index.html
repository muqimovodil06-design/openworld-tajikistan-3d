
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPEN WORLD TAJIKISTAN 3D</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
}

#info {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  background: #0009;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 5;
  line-height: 1.6;
}

#message {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #0009;
  padding: 10px 16px;
  border-radius: 10px;
  z-index: 5;
  text-align: center;
  font-size: 13px;
  white-space: nowrap;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 15px;
  display: grid;
  grid-template-columns: 55px 55px 55px;
  grid-template-rows: 55px 55px;
  gap: 5px;
  z-index: 10;
}

.control {
  border: 1px solid #ffffff88;
  background: #111a;
  color: white;
  border-radius: 13px;
  font-size: 22px;
  font-weight: bold;
  user-select: none;
  touch-action: none;
}

#up { grid-column: 2; grid-row: 1; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#actions {
  position: fixed;
  right: 15px;
  bottom: 25px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 10;
}

.action {
  min-width: 85px;
  padding: 14px 12px;
  color: white;
  background: #111b;
  border: 1px solid #ffffff88;
  border-radius: 13px;
  font-size: 14px;
  font-weight: bold;
  touch-action: none;
}

#hint {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 11px;
  background: #0008;
  padding: 5px 8px;
  border-radius: 7px;
  z-index: 5;
}
</style>
</head>

<body>

<div id="info">
  <b>OPEN WORLD TAJIKISTAN 3D 🇹🇯</b><br>
  📍 Душанбе<br>
  <span id="timeText">День</span><br>
  <span id="modeText">Режим: пешком</span>
</div>

<div id="message">Добро пожаловать в Душанбе!</div>

<div id="controls">
  <button class="control" id="up">▲</button>
  <button class="control" id="left">◀</button>
  <button class="control" id="down">▼</button>
  <button class="control" id="right">▶</button>
</div>

<div id="actions">
  <button class="action" id="jumpButton">ПРЫЖОК</button>
  <button class="action" id="carButton">СЕСТЬ В F</button>
</div>

<div id="hint">WASD — движение | SPACE — прыжок | F — машина | Мышь — камера</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ОСНОВА ИГРЫ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 450);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;

document.body.appendChild(renderer.domElement);

/* ОСВЕЩЕНИЕ */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x555566,
  1.5
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(100, 150, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

/* МАТЕРИАЛЫ */

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const grassMat = material(0x4b8c45);
const roadMat = material(0x303238);
const sidewalkMat = material(0x999999);
const whiteMat = material(0xffffff);
const blackMat = material(0x111111);

/* ЗЕМЛЯ */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  grassMat
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ДОРОГИ */

function makeRoad(x, z, width, length, rotation = 0) {
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(width, length),
    roadMat
  );

  road.rotation.x = -Math.PI / 2;
  road.rotation.z = rotation;
  road.position.set(x, 0.025, z);
  road.receiveShadow = true;
  scene.add(road);

  for (let i = -length / 2 + 5; i < length / 2; i += 12) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.04, 5),
      whiteMat
    );

    line.position.set(x, 0.06, z + i);
    line.rotation.y = rotation;
    scene.add(line);
  }
}

makeRoad(0, 0, 22, 500);
makeRoad(70, 0, 18, 500);
makeRoad(-70, 0, 18, 500);

makeRoad(0, 60, 500, 18, Math.PI / 2);
makeRoad(0, -60, 500, 18, Math.PI / 2);

/* ЗДАНИЯ */

const buildingColors = [
  0xe1d2bd,
  0xd4dce5,
  0xf0e5d0,
  0xc5c5c5,
  0xd9c5a8,
  0xb9c9d8
];

function createBuilding(x, z, w, h, d) {
  const color = buildingColors[
    Math.floor(Math.random() * buildingColors.length)
  ];

  const building = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color)
  );

  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  building.add(body);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.5, 0.7, d + 0.5),
    material(0x777777)
  );

  roof.position.y = h + 0.35;
  building.add(roof);

  const windowMat = new THREE.MeshStandardMaterial({
    color: 0x75b9d8,
    metalness: 0.25,
    roughness: 0.25
  });

  for (let y = 3; y < h - 1; y += 3) {
    for (let wx = -w / 2 + 1.5; wx < w / 2 - 0.5; wx += 3) {
      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.5, 0.08),
        windowMat
      );

      windowMesh.position.set(wx, y, d / 2 + 0.05);
      building.add(windowMesh);
    }
  }

  building.position.set(x, 0, z);
  scene.add(building);
}

/* ГОРОДСКАЯ СЕТКА */

for (let x = -180; x <= 180; x += 35) {
  for (let z = -180; z <= 180; z += 40) {
    if (
      Math.abs(x) < 20 ||
      Math.abs(x - 70) < 14 ||
      Math.abs(x + 70) < 14 ||
      Math.abs(z - 60) < 14 ||
      Math.abs(z + 60) < 14
    ) continue;

    const w = 12 + Math.random() * 10;
    const d = 12 + Math.random() * 10;
    const h = 12 + Math.random() * 38;

    createBuilding(x, z, w, h, d);
  }
}

/* ВЫСОКИЕ ЗДАНИЯ */

createBuilding(35, -20, 18, 65, 18);
createBuilding(-35, 25, 20, 48, 20);
createBuilding(110, 100, 22, 55, 22);

/* ПЛОЩАДЬ */

const square = new THREE.Mesh(
  new THREE.BoxGeometry(75, 0.25, 65),
  material(0xc6b99d)
);

square.position.set(0, 0.13, 0);
scene.add(square);

/* ФОНТАН */

const fountain = new THREE.Mesh(
  new THREE.CylinderGeometry(8, 9, 1.2, 32),
  material(0x999999)
);

fountain.position.set(0, 0.7, 0);
scene.add(fountain);

const water = new THREE.Mesh(
  new THREE.CylinderGeometry(6.5, 6.5, 0.15, 32),
  new THREE.MeshStandardMaterial({
    color: 0x36bde0,
    metalness: 0.5,
    roughness: 0.15
  })
);

water.position.set(0, 1.35, 0);
scene.add(water);

/* ФЛАГ ТАДЖИКИСТАНА */

const flag = new THREE.Group();

const flagRed = new THREE.Mesh(
  new THREE.BoxGeometry(5, 0.9, 0.08),
  material(0xd71920)
);

const flagWhite = new THREE.Mesh(
  new THREE.BoxGeometry(5, 0.9, 0.08),
  whiteMat
);

const flagGreen = new THREE.Mesh(
  new THREE.BoxGeometry(5, 0.9, 0.08),
  material(0x168447)
);

flagRed.position.y = 1.8;
flagWhite.position.y = 0.9;
flagGreen.position.y = 0;

flag.add(flagRed, flagWhite, flagGreen);

const flagPole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.12, 8, 12),
  material(0xaaaaaa)
);

flagPole.position.y = 4;
flag.add(flagPole);

flag.position.set(-15, 0, -10);
scene.add(flag);

/* ДЕРЕВЬЯ */

function createTree(x, z) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.5, 4, 8),
    material(0x704323)
  );

  trunk.position.y = 2;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 12, 12),
    material(0x207a35)
  );

  leaves.position.y = 5;
  leaves.castShadow = true;
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

for (let i = 0; i < 100; i++) {
  const x = (Math.random() - 0.5) * 400;
  const z = (Math.random() - 0.5) * 400;

  if (Math.abs(x) > 20 && Math.abs(x) < 50) continue;
  if (Math.abs(z) < 15) continue;

  createTree(x, z);
}

/* ГОРЫ ВОКРУГ ГОРОДА */

for (let i = 0; i < 45; i++) {
  const angle = (i / 45) * Math.PI * 2;
  const radius = 300 + Math.random() * 50;
  const height = 50 + Math.random() * 100;

  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(
      30 + Math.random() * 25,
      height,
      5
    ),
    material(0x777d83)
  );

  mountain.position.set(
    Math.cos(angle) * radius,
    height / 2 - 5,
    Math.sin(angle) * radius
  );

  mountain.rotation.y = Math.random() * Math.PI;
  scene.add(mountain);
}

/* ИГРОК */

const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.65, 1.1, 4, 8),
  material(0x2458d5)
);

body.position.y = 1.5;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 16, 16),
  material(0xf0c39a)
);

head.position.y = 2.55;
player.add(head);

const legMat = material(0x222222);

const leg1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.3, 0.9, 0.35),
  legMat
);

const leg2 = leg1.clone();

leg1.position.set(-0.25, 0.45, 0);
leg2.position.set(0.25, 0.45, 0);

player.add(leg1, leg2);

player.position.set(0, 0, 25);
scene.add(player);

/* МАШИНА */

const car = new THREE.Group();

const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(4.5, 1.1, 7),
  material(0xc90000)
);

carBody.position.y = 1;
carBody.castShadow = true;
car.add(carBody);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(3.5, 1.2, 3.5),
  material(0x7eb8d8, 0.3)
);

cabin.position.set(0, 2, -0.4);
car.add(cabin);

function makeWheel(x, z) {
  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.65, 0.65, 0.45, 16),
    blackMat
  );

  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(x, 0.65, z);
  car.add(wheel);
}

makeWheel(-2.2, 2.2);
makeWheel(2.2, 2.2);
makeWheel(-2.2, -2.2);
makeWheel(2.2, -2.2);

car.position.set(9, 0, 25);
scene.add(car);

/* УПРАВЛЕНИЕ */

const keys = {};

let driving = false;
let velocityY = 0;
let onGround = true;

let yaw = 0;
let cameraAngle = 0.35;
let cameraDistance = 11;

let dayTime = 0;
const cycleDuration = 240;

function jump() {
  if (!driving && onGround) {
    velocityY = 9;
    onGround = false;
  }
}

function toggleCar() {
  if (!driving) {
    const distance = player.position.distanceTo(car.position);

    if (distance < 9) {
      driving = true;
      document.getElementById("message").textContent =
        "Вы сели в машину!";

      document.getElementById("carButton").textContent =
        "ВЫЙТИ F";

      document.getElementById("modeText").textContent =
        "Режим: машина";
    } else {
      document.getElementById("message").textContent =
        "Подойдите ближе к машине!";
    }
  } else {
    driving = false;

    player.position.set(
      car.position.x + 5,
      0,
      car.position.z
    );

    document.getElementById("message").textContent =
      "Вы вышли из машины";

    document.getElementById("carButton").textContent =
      "СЕСТЬ В F";

    document.getElementById("modeText").textContent =
      "Режим: пешком";
  }
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;

  if (
    e.code === "Space" ||
    e.code.startsWith("Arrow")
  ) {
    e.preventDefault();
  }

  if (e.code === "Space" && !e.repeat) {
    jump();
  }

  if (e.code === "KeyF" && !e.repeat) {
    toggleCar();
  }
});

window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

/* КНОПКИ ТЕЛЕФОНА */

function bindButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("pointerup", () => {
    keys[key] = false;
  });

  button.addEventListener("pointerleave", () => {
    keys[key] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[key] = false;
  });
}

bindButton("up", "KeyW");
bindButton("down", "KeyS");
bindButton("left", "KeyA");
bindButton("right", "KeyD");

document.getElementById("jumpButton").addEventListener(
  "pointerdown",
  (e) => {
    e.preventDefault();
    jump();
  }
);

document.getElementById("carButton").addEventListener(
  "click",
  toggleCar
);

/* КАМЕРА МЫШЬЮ И ПАЛЬЦЕМ */

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  yaw -= dx * 0.005;
  cameraAngle = THREE.MathUtils.clamp(
    cameraAngle + dy * 0.004,
    -0.1,
    1.1
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

/* АВТОМАТИЧЕСКИЙ ДЕНЬ И НОЧЬ */

const daySky = new THREE.Color(0x87ceeb);
const nightSky = new THREE.Color(0x101a35);
const sunsetSky = new THREE.Color(0xe58a61);

function automaticDayNight(dt) {
  dayTime += dt;

  const cycle = (dayTime % cycleDuration) / cycleDuration;
  const sunHeight = Math.sin(cycle * Math.PI * 2);

  const daylight = THREE.MathUtils.clamp(
    sunHeight * 0.5 + 0.5,
    0.08,
    1
  );

  const sunset = Math.max(
    0,
    1 - Math.abs(sunHeight) * 5
  );

  const sky = nightSky.clone().lerp(daySky, daylight);
  sky.lerp(sunsetSky, sunset * 0.45);

  scene.background.copy(sky);
  scene.fog.color.copy(sky);

  ambient.intensity = 0.2 + daylight * 1.4;
  sun.intensity = daylight * 2.5;

  sun.position.set(
    Math.cos(cycle * Math.PI * 2) * 150,
    20 + daylight * 180,
    50
  );

  document.getElementById("timeText").textContent =
    daylight > 0.35 ? "☀️ День" : "🌙 Ночь";
}

/* ДВИЖЕНИЕ ИГРОКА И МАШИНЫ */

function update(dt) {
  let forward = 0;
  let sideways = 0;

  if (keys["KeyW"] || keys["ArrowUp"]) forward += 1;
  if (keys["KeyS"] || keys["ArrowDown"]) forward -= 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) sideways -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) sideways += 1;

  const moving = forward !== 0 || sideways !== 0;

  if (driving) {
    const speed = 25;

    if (forward !== 0) {
      car.position.x -= Math.sin(yaw) * forward * speed * dt;
      car.position.z -= Math.cos(yaw) * forward * speed * dt;
    }

    if (sideways !== 0) {
      car.rotation.y -= sideways * dt * 1.5;
      yaw = car.rotation.y;
    }

    car.rotation.y = yaw;

    player.position.copy(car.position);
  } else {
    const speed = 12;

    const moveX =
      -Math.sin(yaw) * forward +
      Math.cos(yaw) * sideways;

    const moveZ =
      -Math.cos(yaw) * forward -
      Math.sin(yaw) * sideways;

    const length = Math.hypot(moveX, moveZ);

    if (length > 0) {
      player.position.x +=
        (moveX / length) * speed * dt;

      player.position.z +=
        (moveZ / length) * speed * dt;

      player.rotation.y = Math.atan2(moveX, moveZ);
    }

    velocityY -= 22 * dt;
    player.position.y += velocityY * dt;

    if (player.position.y <= 0) {
      player.position.y = 0;
      velocityY = 0;
      onGround = true;
    }
  }

  /* ОГРАНИЧЕНИЕ КАРТЫ */

  player.position.x = THREE.MathUtils.clamp(
    player.position.x,
    -450,
    450
  );

  player.position.z = THREE.MathUtils.clamp(
    player.position.z,
    -450,
    450
  );

  car.position.x = THREE.MathUtils.clamp(
    car.position.x,
    -450,
    450
  );

  car.position.z = THREE.MathUtils.clamp(
    car.position.z,
    -450,
    450
  );

  /* КАМЕРА СЛЕДУЕТ ЗА ИГРОКОМ */

  const target = driving ? car.position : player.position;

  const distance = cameraDistance;

  const cameraX =
    target.x + Math.sin(yaw) * Math.cos(cameraAngle) * distance;

  const cameraY =
    target.y + 3 + Math.sin(cameraAngle) * distance;

  const cameraZ =
    target.z + Math.cos(yaw) * Math.cos(cameraAngle) * distance;

  camera.position.lerp(
    new THREE.Vector3(cameraX, cameraY, cameraZ),
    0.12
  );

  camera.lookAt(
    target.x,
    target.y + 1.4,
    target.z
  );

  if (moving && !driving && onGround) {
    const walk = Math.sin(performance.now() * 0.012) * 0.2;
    leg1.rotation.x = walk;
    leg2.rotation.x = -walk;
  } else {
    leg1.rotation.x = 0;
    leg2.rotation.x = 0;
  }
}

/* ЗАПУСК */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  automaticDayNight(dt);
  update(dt);

  renderer.render(scene, camera);
}

animate();

/* ИЗМЕНЕНИЕ РАЗМЕРА ЭКРАНА */

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>
</body>
</html>
