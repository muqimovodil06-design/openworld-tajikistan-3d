
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPEN WORLD TAJIKISTAN 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#top{
 position:fixed;top:12px;left:12px;z-index:5;
 background:#101b29cc;padding:12px 16px;border-radius:12px;
 font-size:14px;line-height:1.6
}
#top strong{font-size:18px;color:#ffd84d}
#help{position:fixed;right:12px;top:12px;background:#101b29cc;
 padding:10px;border-radius:10px;font-size:12px;z-index:5}
#controls{position:fixed;bottom:20px;left:20px;z-index:8;
 display:grid;grid-template-columns:55px 55px 55px;gap:7px}
.ctrl{width:55px;height:55px;border:1px solid #ffffff99;
 border-radius:14px;background:#14263dcc;color:white;
 font-size:23px;touch-action:none}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{position:fixed;bottom:25px;right:18px;z-index:8;
 display:flex;flex-direction:column;gap:9px}
.action{background:#152b43dd;color:white;border:1px solid #ffffff88;
 padding:13px;border-radius:12px;font-size:13px}
#message{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
 color:white;background:#101b29aa;padding:7px 12px;border-radius:8px;
 font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<div id="top">
<strong>🇹🇯 DUSHANBE 3D</strong><br>
OPEN WORLD TAJIKISTAN<br>
Место: <span id="place">Душанбе</span><br>
Режим: Свободная прогулка
</div>

<div id="help">WASD — движение<br>Мышь — камера<br>Пробел — прыжок</div>

<div id="controls">
<button class="ctrl" id="up">▲</button>
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="down">▼</button>
<button class="ctrl" id="right">▶</button>
</div>

<div id="actions">
<button class="action" id="jump">ПРЫЖОК</button>
<button class="action" id="day">ДЕНЬ / НОЧЬ</button>
<button class="action" id="car">СЕСТЬ В МАШИНУ</button>
</div>

<div id="message">Добро пожаловать в Душанбе 🇹🇯</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x9bc8dc, 100, 550);

const camera = new THREE.PerspectiveCamera(
 70, innerWidth/innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ОСВЕЩЕНИЕ
const ambient = new THREE.HemisphereLight(0xc8e7ff,0x66533d,2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe0a3,3);
sun.position.set(-100,150,80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;
scene.add(sun);

// МАТЕРИАЛЫ
const mat=(color,roughness=0.9)=>new THREE.MeshStandardMaterial({
 color,roughness
});

const grass=mat(0x648b48);
const road=mat(0x30343b);
const sidewalk=mat(0xb9b6a9);
const white=mat(0xffffff);
const dark=mat(0x202b36);
const glass=new THREE.MeshStandardMaterial({
 color:0x75b9d5,metalness:0.35,roughness:0.2
});
const green=mat(0x27713c);
const trunk=mat(0x654329);

// ПОЛ
function box(w,h,d,material,x,y,z,shadows=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=shadows;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

box(1000,1,1000,grass,0,-0.6,0);

// ГОРОДСКИЕ ДОРОГИ
function makeRoad(x,z,w,d){
 box(w,0.12,d,road,x,0,z);
 if(w>d){
  for(let a=-w/2+5;a<w/2-2;a+=12)
   box(5,0.025,0.22,white,x+a,0.075,z);
 }else{
  for(let a=-d/2+5;a<d/2-2;a+=12)
   box(0.22,0.025,5,white,x,0.075,z+a);
 }
}
makeRoad(0,0,500,22);
makeRoad(0,-90,500,18);
makeRoad(0,90,500,18);
makeRoad(-100,0,18,250);
makeRoad(100,0,18,250);
makeRoad(200,0,18,250);
makeRoad(-200,0,18,250);

// ТРОТУАРЫ
for(let z of [-13,13]){
 box(500,0.3,4,sidewalk,0,0.08,z);
}
for(let z of [-90,90]){
 box(500,0.3,3,sidewalk,0,0.08,z+11);
}

// ЗДАНИЯ
function building(x,z,w,d,h,color){
 box(w,h,d,mat(color),x,h/2,z);
 // крыша
 box(w+0.5,0.5,d+0.5,mat(0x777b80),x,h+0.2,z);
 // окна
 const rows=Math.max(2,Math.floor(h/4));
 const cols=Math.max(2,Math.floor(w/3));
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const wx=x-w/2+1.5+c*(w-2)/(cols-1);
   const wy=2.1+r*(h-3)/(rows);
   box(1.1,1.35,0.12,glass,wx,wy,z-d/2-0.08,false);
   box(1.1,1.35,0.12,glass,wx,wy,z+d/2+0.08,false);
  }
 }
 // вход
 box(2.2,3,0.18,dark,x,1.5,z-d/2-0.13,false);
}

// Кварталы города
const colors=[0xe7d7bb,0xd6c6a5,0xd8dce0,0xe5c49a,0xbac9c8,0xd5d0bd];

for(let x=-220;x<=220;x+=40){
 for(let z of [-42,-137,42,137]){
  if(Math.abs(x)<30 && Math.abs(z)<55)continue;
  let h=12+Math.random()*28;
  building(x,z,22,22,h,colors[Math.floor(Math.random()*colors.length)]);
 }
}

// ВЫСОТНЫЕ ЗДАНИЯ
building(-55,-42,25,25,55,0xd9d2c5);
building(55,-42,28,25,65,0xe6dfd1);
building(-55,42,28,25,38,0xc4d1d0);
building(55,42,25,25,45,0xe1c9a9);

// ПЛОЩАДЬ ДУСТИ
box(90,0.25,75,mat(0xd3c5a8),0,0.1,0);

// ПЛОЩАДЬ И ФОНТАН
const fountain= new THREE.Mesh(
 new THREE.CylinderGeometry(9,10,1,48),
 mat(0x8a969b)
);
fountain.position.set(0,0.7,0);
scene.add(fountain);

const water=new THREE.Mesh(
 new THREE.CylinderGeometry(7.5,7.5,0.15,48),
 new THREE.MeshStandardMaterial({
 color:0x35a9db,metalness:0.5,roughness:0.15
 })
);
water.position.set(0,1.3,0);
scene.add(water);

const fountainCenter=new THREE.Mesh(
 new THREE.CylinderGeometry(0.7,0.7,5,16),
 mat(0xd6d0c1)
);
fountainCenter.position.set(0,3.5,0);
scene.add(fountainCenter);

// ФЛАГ ТАДЖИКИСТАНА
box(0.4,32,0.4,mat(0xc7c7c7),0,16,24);

function flagStripe(color,y){
 box(12,2.2,0.12,mat(color),6,y,24);
}
flagStripe(0xcc2027,24);
flagStripe(0xffffff,21.8);
flagStripe(0x168b43,19.6);

// КОРОНА И ЗВЁЗДЫ
const crown= new THREE.Mesh(
 new THREE.ConeGeometry(1.5,2,5),
 mat(0xf3c844)
);
crown.position.set(6,22.9,23.8);
scene.add(crown);

for(let i=0;i<7;i++){
 const star=new THREE.Mesh(
 new THREE.SphereGeometry(0.3,8,8),
 mat(0xf5d34b)
 );
 const angle=i*Math.PI*2/7;
 star.position.set(6+Math.cos(angle)*2,21.5,23.5+Math.sin(angle)*0.2);
 scene.add(star);
}

// ДЕРЕВЬЯ
function tree(x,z,s=1){
 const t=new THREE.Mesh(
 new THREE.CylinderGeometry(0.35*s,0.55*s,4*s,8),trunk
 );
 t.position.set(x,2*s,z);
 scene.add(t);
 const crown=new THREE.Mesh(
 new THREE.SphereGeometry(2.5*s,10,9),green
 );
 crown.position.set(x,5*s,z);
 crown.castShadow=true;
 scene.add(crown);
}
for(let x=-230;x<=230;x+=13){
 tree(x,-17,0.8+Math.random()*0.4);
 tree(x,17,0.8+Math.random()*0.4);
}
for(let z=-150;z<=150;z+=18){
 tree(-115,z,1);
 tree(115,z,1);
}

// ГОРЫ
function mountain(x,z,r,h,color){
 const m=new THREE.Mesh(
 new THREE.ConeGeometry(r,h,7),
 mat(color)
 );
 m.position.set(x,h/2-1,z);
 m.rotation.y=Math.random()*2;
 m.receiveShadow=true;
 scene.add(m);
}
for(let i=0;i<35;i++){
 const x=-450+i*27;
 mountain(x,-360,40+Math.random()*30,90+Math.random()*100,0x718b91);
 mountain(x,360,40+Math.random()*30,90+Math.random()*100,0x718b91);
}

// СОЛНЦЕ
const sunBall=new THREE.Mesh(
 new THREE.SphereGeometry(15,24,24),
 new THREE.MeshBasicMaterial({color:0xffe6a0})
);
sunBall.position.set(-180,150,-300);
scene.add(sunBall);

// ФОНАРИ
function lamp(x,z){
 box(0.35,8,0.35,dark,x,4,z);
 box(2,0.25,0.25,dark,x+0.8,8,z);
 const light=new THREE.PointLight(0xffd58a,0,15);
 light.position.set(x+1.4,7.8,z);
 scene.add(light);
 const bulb=new THREE.Mesh(
 new THREE.SphereGeometry(0.4,10,10),
 mat(0xffe7aa)
 );
 bulb.position.copy(light.position);
 scene.add(bulb);
 return light;
}
const lamps=[];
for(let x=-220;x<=220;x+=28){
 lamps.push(lamp(x,-17));
 lamps.push(lamp(x,17));
}

// МАШИНА
const car=new THREE.Group();
const carBody=new THREE.Mesh(
 new THREE.BoxGeometry(4.5,1.5,7),
 mat(0xc9232d)
);
carBody.position.y=1.3;
car.add(carBody);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(3.5,1.5,3.5),
 glass
);
cabin.position.set(0,2.7,-0.4);
car.add(cabin);

for(let x of [-2.2,2.2]){
 for(let z of [-2.3,2.3]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(0.7,0.7,0.45,16),
   dark
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,0.8,z);
  car.add(wheel);
 }
}
car.position.set(15,0,30);
scene.add(car);

// ИГРОК
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.65,1.2,4,8),
 mat(0x2465c7)
);
body.position.y=1.6;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.5,16,12),
 mat(0xe8b68e)
);
head.position.y=2.8;
player.add(head);

const leg1=new THREE.Mesh(
 new THREE.BoxGeometry(0.45,1,0.5),dark
);
leg1.position.set(-0.3,0.5,0);
player.add(leg1);

const leg2=leg1.clone();
leg2.position.x=0.3;
player.add(leg2);

player.position.set(0,0,45);
scene.add(player);

// УПРАВЛЕНИЕ
const keys={};
let yaw=0;
let pitch=-0.2;
let jumping=false;
let velocityY=0;
let driving=false;
let night=false;

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space')jump();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[key]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}
bindButton('up','w');
bindButton('down','s');
bindButton('left','a');
bindButton('right','d');

function jump(){
 if(!jumping){
  jumping=true;
  velocityY=0.22;
 }
}
document.getElementById('jump').onclick=jump;

// КАМЕРА МЫШЬ / СЕНСОР
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw-=(e.clientX-lastX)*0.005;
 pitch-=(e.clientY-lastY)*0.004;
 pitch=Math.max(-0.8,Math.min(0.3,pitch));
 lastX=e.clientX;lastY=e.clientY;
});

// ПОВОРОТ КАМЕРЫ НА ТЕЛЕФОНЕ
let touchStartX=0,touchStartY=0;
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===1){
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===1){
  const x=e.touches[0].clientX;
  const y=e.touches[0].clientY;
  yaw-=(x-touchStartX)*0.004;
  pitch-=(y-touchStartY)*0.003;
  pitch=Math.max(-0.8,Math.min(0.3,pitch));
  touchStartX=x;touchStartY=y;
 }
},{passive:true});

// МАШИНА
document.getElementById('car').onclick=()=>{
 if(!driving && player.position.distanceTo(car.position)<10){
  driving=true;
  document.getElementById('car').innerText='ВЫЙТИ ИЗ МАШИНЫ';
 }else if(driving){
  driving=false;
  player.position.x=car.position.x+5;
  player.position.z=car.position.z;
  document.getElementById('car').innerText='СЕСТЬ В МАШИНУ';
 }
};

// ДЕНЬ / НОЧЬ
document.getElementById('day').onclick=()=>{
 night=!night;
 if(night){
  scene.background.set(0x101c38);
  scene.fog.color.set(0x17263b);
  sun.intensity=0.25;
  ambient.intensity=0.35;
  lamps.forEach(l=>l.intensity=2);
  sunBall.visible=false;
 }else{
  scene.background.set(0x87ceeb);
  scene.fog.color.set(0x9bc8dc);
  sun.intensity=3;
  ambient.intensity=2;
  lamps.forEach(l=>l.intensity=0);
  sunBall.visible=true;
 }
};

// ДВИЖЕНИЕ
const clock=new THREE.Clock();
const cameraTarget=new THREE.Vector3();

function update(dt){
 let forward=0,side=0;
 if(keys.w||keys.arrowup)forward+=1;
 if(keys.s||keys.arrowdown)forward-=1;
 if(keys.a||keys.arrowleft)side-=1;
 if(keys.d||keys.arrowright)side+=1;

 const speed=driving?28:12;
 const direction=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );
 const right=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 if(driving){
  car.position.addScaledVector(direction,forward*speed*dt);
  car.position.addScaledVector(right,side*speed*dt);
  car.rotation.y=yaw;
  player.position.copy(car.position);
 }else{
  player.position.addScaledVector(direction,forward*speed*dt);
  player.position.addScaledVector(right,side*speed*dt);
  if(forward||side)player.rotation.y=yaw;
 }

 // Прыжок
 if(jumping){
  player.position.y+=velocityY*60*dt;
  velocityY-=0.012*60*dt;
  if(player.position.y<=0){
   player.position.y=0;
   jumping=false;
   velocityY=0;
  }
 }

 // Камера
 const target=driving?car.position:player.position;
 const distance=driving?15:10;
 const height=driving?6:5;
 const offset=new THREE.Vector3(
  Math.sin(yaw)*distance,
  height-pitch*5,
  Math.cos(yaw)*distance
 );
 camera.position.lerp(
  new THREE.Vector3(target.x+offset.x,target.y+offset.y,target.z+offset.z),
  0.12
 );
 cameraTarget.set(target.x,target.y+2,target.z);
 camera.lookAt(cameraTarget);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);
 update(dt);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
