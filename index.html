
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEN WORLD TAJIKISTAN 3D</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
  touch-action:none;
}
canvas { display:block; }
#title {
  position:absolute; top:12px; left:12px;
  color:white; font-weight:bold;
  font-size:18px; text-shadow:2px 2px 5px black;
}
#info {
  position:absolute; top:42px; left:12px;
  color:white; text-shadow:1px 1px 4px black;
}
#controls {
  position:absolute; bottom:20px; left:12px;
  display:grid;
  grid-template-columns:55px 55px 55px;
  gap:7px;
}
button {
  border:2px solid white;
  border-radius:12px;
  background:#173c69;
  color:white;
  font-weight:bold;
  font-size:18px;
  padding:13px;
  touch-action:none;
}
#jump {
  position:absolute; bottom:25px; right:15px;
}
#carBtn {
  position:absolute; bottom:90px; right:15px;
  background:#b51d1d;
  font-size:15px;
}
</style>
</head>

<body>
<div id="title">OPEN WORLD TAJIKISTAN 🇹🇯</div>
<div id="info">Режим: Пешком</div>

<div id="controls">
  <div></div>
  <button id="forward">W ▲</button>
  <div></div>
  <button id="left">A ◀</button>
  <button id="back">S ▼</button>
  <button id="right">D ▶</button>
</div>

<button id="jump">JUMP</button>
<button id="carBtn">🚗 СЕСТЬ В МАШИНУ</button>

<script type="module">
import * as THREE from 'three';

// СЦЕНА
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 70, 230);

// КАМЕРА
  // УПРАВЛЕНИЕ МЫШКОЙ
let mouseX = 0;
let mouseY = 0;
let cameraDistance = 9;

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === renderer.domElement) {
    mouseX -= e.movementX * 0.003;
    mouseY += e.movementY * 0.003;
    mouseY = THREE.MathUtils.clamp(mouseY, -0.5, 1);
  }
});

renderer.domElement.addEventListener('click', () => {
  if (window.matchMedia('(pointer:fine)').matches) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('wheel', (e) => {
  cameraDistance = THREE.MathUtils.clamp(
    cameraDistance + e.deltaY * 0.01, 4, 18
  );
});
const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 500
);

// РЕНДЕР
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

// СВЕТ
scene.add(new THREE.HemisphereLight(0xffffff, 0x65734c, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(30, 50, 20);
scene.add(sun);

// ЗЕМЛЯ
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({color:0x57934b})
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ГОРЫ
function mountain(x, z, size, height) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(size, height, 5),
    new THREE.MeshStandardMaterial({color:0x777777})
  );
  mesh.position.set(x, height / 2 - 2, z);
  scene.add(mesh);
}
for (let i=0; i<25; i++) {
  mountain(
    (Math.random()-.5)*350,
    (Math.random()-.5)*350,
    12+Math.random()*20,
    20+Math.random()*35
  );
}

// ДОРОГИ
function road(x,z,w,d) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,0.08,d),
    new THREE.MeshStandardMaterial({color:0x333333})
  );
  mesh.position.set(x,0.04,z);
  scene.add(mesh);
}
road(0,0,400,12);
road(0,0,12,400);

// ДОМА
function building(x,z,w,h,d) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:0xd6c2a1})
  );
  mesh.position.set(x,h/2,z);
  scene.add(mesh);
}
for (let x=-70; x<=70; x+=25) {
  for (let z=-70; z<=70; z+=25) {
    if (Math.abs(x)<15 || Math.abs(z)<15) continue;
    building(x,z,10,8+Math.random()*12,10);
  }
}

// ДЕРЕВЬЯ
function tree(x,z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.2,.3,2),
    new THREE.MeshStandardMaterial({color:0x70452a})
  );
  trunk.position.set(x,1,z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.5,8,8),
    new THREE.MeshStandardMaterial({color:0x247a35})
  );
  leaves.position.set(x,2.8,z);
  scene.add(leaves);
}
for (let i=0;i<80;i++) {
  tree((Math.random()-.5)*300,(Math.random()-.5)*300);
}

// ПЕРСОНАЖ
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(.45,.8,4,8),
  new THREE.MeshStandardMaterial({color:0x1769aa})
);
body.position.y=1;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(.3,12,12),
  new THREE.MeshStandardMaterial({color:0xe5b58c})
);
head.position.y=1.8;
player.add(head);

player.position.set(0,0,5);
scene.add(player);

// МАШИНА
const car = new THREE.Group();

const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(2.4,.8,4),
  new THREE.MeshStandardMaterial({color:0xff2222})
);
carBody.position.y=.8;
car.add(carBody);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.7,.9,2),
  new THREE.MeshStandardMaterial({color:0x333333})
);
cabin.position.set(0,1.6,-.2);
car.add(cabin);

for (const x of [-1.2,1.2]) {
  for (const z of [-1.2,1.2]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(.4,.4,.3,16),
      new THREE.MeshStandardMaterial({color:0x111111})
    );
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,.4,z);
    car.add(wheel);
  }
}

car.position.set(4,0,5);
scene.add(car);

// УПРАВЛЕНИЕ
const keys = {};

const keyMap = {
  KeyA:'left',
  KeyD:'right',
  KeyW:'forward',
  KeyS:'back'
};

window.addEventListener('keydown',e=>{
  if(keyMap[e.code]) {
    keys[keyMap[e.code]]=true;
    e.preventDefault();
  }
});

window.addEventListener('keyup',e=>{
  if(keyMap[e.code]) {
    keys[keyMap[e.code]]=false;
    e.preventDefault();
  }
});

['left','right','forward','back'].forEach(id=>{
  const btn=document.getElementById(id);
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    keys[id]=true;
  });
  ['pointerup','pointerleave','pointercancel'].forEach(event=>{
    btn.addEventListener(event,()=>keys[id]=false);
  });
});

// ПРЫЖОК
let velocityY=0;
let grounded=true;

document.getElementById('jump').addEventListener('pointerdown',()=>{
  if(!driving && grounded) {
    velocityY=7;
    grounded=false;
  }
});

// МАШИНА: СЕСТЬ И ВЫЙТИ
let driving=false;

document.getElementById('carBtn').addEventListener('click',()=>{
  driving=!driving;

  if(driving) {
    player.visible=false;
    car.visible=true;
    document.getElementById('carBtn').textContent='ВЫЙТИ ИЗ МАШИНЫ';
    document.getElementById('info').textContent='Режим: За рулём 🚗';
  } else {
    player.position.set(car.position.x+2,0,car.position.z);
    player.visible=true;
    document.getElementById('carBtn').textContent='🚗 СЕСТЬ В МАШИНУ';
    document.getElementById('info').textContent='Режим: Пешком';
  }
});

// ДВИЖЕНИЕ
function animate() {
  requestAnimationFrame(animate);

  const controlled = driving ? car : player;
  const speed = driving ? .3 : .13;

  if(keys.forward) controlled.position.z-=speed;
  if(keys.back) controlled.position.z+=speed;
  if(keys.left) controlled.position.x-=speed;
  if(keys.right) controlled.position.x+=speed;

  if(!driving) {
    velocityY-=.025;
    player.position.y+=velocityY;

    if(player.position.y<0) {
      player.position.y=0;
      velocityY=0;
      grounded=true;
    }
  }

  controlled.position.x=THREE.MathUtils.clamp(
    controlled.position.x,-190,190
  );
  controlled.position.z=THREE.MathUtils.clamp(
    controlled.position.z,-190,190
  );

  const targetX = controlled.position.x;
const targetY = controlled.position.y + 1;
const targetZ = controlled.position.z;

camera.position.set(
  targetX + Math.sin(mouseX) * cameraDistance,
  targetY + 5 + mouseY * 4,
  targetZ + Math.cos(mouseX) * cameraDistance
);

camera.lookAt(targetX, targetY, targetZ);

  renderer.render(scene,camera);
}

animate();

// РАЗМЕР ЭКРАНА
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
