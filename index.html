<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OPEN WORLD TAJIKISTAN 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#info{position:absolute;top:10px;left:10px;background:#111b;padding:10px;border-radius:10px;font-size:13px;line-height:1.5}
#help{position:absolute;top:10px;right:10px;background:#111b;padding:10px;border-radius:10px;font-size:12px}
#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:5px;pointer-events:auto}
button{border:1px solid #ffffff88;background:#17243dcc;color:white;border-radius:12px;font-size:20px;width:52px;height:52px;touch-action:none}
.actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:end;max-width:180px}
.actions button{font-size:13px;width:65px;height:52px}
#message{position:absolute;bottom:145px;left:50%;transform:translateX(-50%);background:#111c;padding:9px 15px;border-radius:10px;font-size:13px;display:none}
#mapname{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#111a;padding:6px 12px;border-radius:9px;font-size:12px}
</style>
</head>
<body>
<div id="info">
<b>🇹🇯 OPEN WORLD TAJIKISTAN 3D</b><br>
Район: Душанбе<br>
Транспорт: <span id="vehicle">Пешком</span><br>
Время: <span id="clock">День</span><br>
Работа: <span id="job">Житель</span>
</div>
<div id="help">
W/S — движение<br>
A/D — поворот<br>
SPACE — прыжок<br>
F — транспорт<br>
Мышь — камера
</div>
<div id="message"></div>
<div id="controls">
<div class="pad">
<button data-key="w" style="grid-column:2">▲</button>
<button data-key="a">◀</button>
<button data-key="s">▼</button>
<button data-key="d">▶</button>
</div>
<div class="actions">
<button id="jump">ПРЫЖОК</button>
<button id="enter">F ТРАНСПОРТ</button>
</div>
</div>
<div id="mapname">DUSHANBE • TAJIKISTAN 🇹🇯</div>

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

sun.position.set(70,100,40);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x57944b),roadmat=mat(0x333943),sidewalk=mat(0xbababa);
const white=mat(0xffffff),black=mat(0x202020),red=mat(0xd52c2c);
const blue=mat(0x2475bd),yellow=mat(0xf0c52d),glass=new THREE.MeshStandardMaterial({color:0x9dd8ed,roughness:.2,metalness:.2});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(650,650),green);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function cube(parent,x,y,z,sx,sy,sz,material){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}
function cylinder(parent,x,y,z,r1,r2,h,material){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function sphere(parent,x,y,z,r,material){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),material);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function label(text,x,y,z){
 const c=document.createElement('canvas');c.width=512;c.height=100;
 const ctx=c.getContext('2d');ctx.fillStyle='#102030dd';
 ctx.fillRect(0,0,512,100);ctx.fillStyle='white';
 ctx.font='bold 38px Arial';ctx.textAlign='center';
 ctx.fillText(text,256,65);
 const texture=new THREE.CanvasTexture(c);
 const m=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide});
 const o=new THREE.Mesh(new THREE.PlaneGeometry(8,1.6),m);
 o.position.set(x,y,z);scene.add(o);return o;
}

// Roads
function road(x,z,w,d){
 cube(scene,x,.035,z,w,.08,d,roadmat);
 if(w>d){
  for(let i=-w/2+4;i<w/2-2;i+=9)cube(scene,x+i,.09,z,.5,.025,.18,yellow);
 }else{
  for(let i=-d/2+4;i<d/2-2;i+=9)cube(scene,x,.09,z+i,.18,.025,.5,yellow);
 }
}

// Buildings
const buildings=[];
function building(name,x,z,w,h,d,color){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);

 cube(g,0,h+.3,0,w+.8,.6,d+.8,mat(0x444b55));
 for(let yy=2;yy<h-1;yy+=3){

 }

 label(name,x,h+4,z);
 buildings.push({name,x,z,w,d});
 return g;
}

function tree(x,z){

// Character
function person(role,color=0x334b9b){
 const g=new THREE.Group();
 const bodymat=mat(color),skin=mat(0xe0ae83),pants=mat(0x303846);
 cube(g,0,1.45,0,.8,1,.45,bodymat);
 cube(g,-.48,1.45,0,.22,.9,.25,bodymat);
 cube(g,.48,1.45,0,.22,.9,.25,bodymat);
 sphere(g,0,2.25,0,.38,skin);
 cylinder(g,-.22,.48,0,.14,.16,.9,pants);
 cylinder(g,.22,.48,0,.14,.16,.9,pants);
 cube(g,-.22,.08,.1,.35,.15,.55,black);
 cube(g,.22,.08,.1,.35,.15,.55,black);
 if(role==='ПИЛОТ')cube(g,0,2.57,0,.7,.18,.7,black);
 if(role==='ШАХТЁР'){
  sphere(g,0,2.58,0,.42,yellow);
  const lamp=new THREE.PointLight(0xffeeaa,1,7);lamp.position.set(0,2.6,.5);g.add(lamp);
 }
 g.userData.role=role;g.userData.phase=Math.random()*6;
 return g;
}
const npcs=[];
function addNPC(role,x,z,color,stationary=true){
 const p=person(role,color);p.position.set(x,0,z);scene.add(p);
 p.userData.stationary=stationary;
 p.userData.home=new THREE.Vector3(x,0,z);
 p.userData.angle=Math.random()*6;
 label(role,x,3.5,z);
 npcs.push(p);return p;
}

// Residents sitting around their own places
function seated(role,x,z){
 const p=addNPC(role,x,z,0x536a9a,true);
 p.rotation.x=-.2;
 p.position.y=-.25;
 return p;
}

 }

 g.userData.type=type;g.userData.speed=0;
 scene.add(g);vehicles.push(g);return g;

// Player
const player=person('ИГРОК',0x2462b0);
player.position.set(0,0,0);scene.add(player);
let currentVehicle=null;
let yaw=0,verticalSpeed=0,onGround=true;
const keys={};
let cameraYaw=0,cameraPitch=.25;
let lastTime=0,day=0;
const clock=new THREE.Clock();

function say(t){
 const m=document.getElementById('message');
 m.textContent=t;m.style.display='block';
 clearTimeout(m._timer);m._timer=setTimeout(()=>m.style.display='none',2500);
}
function toggleVehicle(){
 if(currentVehicle){
  player.position.copy(currentVehicle.position);
  player.position.x+=3;
  player.visible=true;
  currentVehicle.userData.speed=0;
  currentVehicle=null;
  document.getElementById('vehicle').textContent='Пешком';
  say('Вы вышли из транспорта');
  return;
 }
 let nearest=null,dist=6;
 for(const v of vehicles){
  const d=player.position.distanceTo(v.position);
  if(d<dist){dist=d;nearest=v;}
 }
 if(nearest){
  currentVehicle=nearest;player.visible=false;
  document.getElementById('vehicle').textContent=nearest.userData.type;
  say('Вы сели: '+nearest.userData.type);
 }else say('Подойдите ближе к машине');
}
document.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='f'&&!e.repeat)toggleVehicle();
 if(e.code==='Space'&&!e.repeat&&onGround&&!currentVehicle){
  verticalSpeed=8;onGround=false;
 }
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
document.getElementById('jump').addEventListener('pointerdown',()=>{
 if(onGround&&!currentVehicle){verticalSpeed=8;onGround=false;}
});
document.getElementById('enter').addEventListener('pointerdown',toggleVehicle);

// Camera drag
let dragging=false,px=0,py=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;px=e.clientX;py=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 cameraYaw-=(e.clientX-px)*.005;
 cameraPitch=Math.max(-.15,Math.min(.8,cameraPitch+(e.clientY-py)*.003));
 px=e.clientX;py=e.clientY;
});

// Day and night
function updateDay(dt){
 day+=dt*.018;
 const v=(Math.sin(day)+1)/2;
 sun.position.set(Math.cos(day)*100,30+v*100,Math.sin(day)*100);
 sun.intensity=.25+v*2;
 scene.background=new THREE.Color().setRGB(.025+v*.5,.035+v*.65,.12+v*.75);
 scene.fog.color.copy(scene.background);
 document.getElementById('clock').textContent=v>.35?'День':'Ночь';
}

// Animation
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 updateDay(dt);

 if(currentVehicle){
  if(keys.w)currentVehicle.userData.speed=Math.min(currentVehicle.userData.speed+dt*8,20);
  if(keys.s)currentVehicle.userData.speed=Math.max(currentVehicle.userData.speed-dt*10,-8);
  if(!keys.w&&!keys.s)currentVehicle.userData.speed*=.97;
  if(keys.a)currentVehicle.rotation.y+=dt*1.7;
  if(keys.d)currentVehicle.rotation.y-=dt*1.7;
  currentVehicle.translateZ(-currentVehicle.userData.speed*dt);
  player.position.copy(currentVehicle.position);
 }else{
  if(keys.a)yaw+=dt*2.2;
  if(keys.d)yaw-=dt*2.2;
  player.rotation.y=yaw;
  const move=(keys.w?1:0)-(keys.s?1:0);
  if(move){
   player.translateZ(-move*dt*9);
  }
  verticalSpeed-=20*dt;
  player.position.y+=verticalSpeed*dt;
  if(player.position.y<0){player.position.y=0;verticalSpeed=0;onGround=true;}
 }

 // Camera
 const target=currentVehicle?currentVehicle.position:player.position;
 const distance=currentVehicle?13:9;
 const cx=target.x+Math.sin(cameraYaw)*distance;
 const cz=target.z+Math.cos(cameraYaw)*distance;
 camera.position.set(cx,target.y+4+cameraPitch*5,cz);
 camera.lookAt(target.x,target.y+1.5,target.z);

 // Police patrol on roads
 police.forEach((p,i)=>{
  const t=clock.elapsedTime*.35+i*1.5;
  p.position.x=-35+Math.sin(t)*35;
  p.position.z=Math.cos(t)*35;
  p.rotation.y=t;
 });

 // NPC idle movement
 npcs.forEach(p=>{
  if(p.userData.stationary){
   p.rotation.z=Math.sin(clock.elapsedTime*2+p.userData.phase)*.025;
  }else{
   p.position.x+=Math.sin(clock.elapsedTime+p.userData.phase)*dt*.3;
  }
 });

 // Train travels back and forth
 train.position.x=-145+((clock.elapsedTime*4)%70);
 if(train.position.x> -75)train.position.x=-145;

 // Aircraft slow taxi movement
 plane.rotation.y=Math.sin(clock.elapsedTime*.1)*.05;

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
