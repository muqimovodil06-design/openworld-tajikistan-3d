
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#101820">

    <title>OPEN WORLD TAJIKISTAN 3D 🇹🇯</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ИГРОВОЙ ЭКРАН -->
    <main id="game">
        <div id="loading">
            <h1>OPEN WORLD</h1>
            <h2>TAJIKISTAN 3D 🇹🇯</h2>
            <p>Загрузка игры...</p>
        </div>
    </main>

    <!-- ИНФОРМАЦИЯ -->
    <div id="status">
        OPEN WORLD TAJIKISTAN 3D 🇹🇯
    </div>

    <div id="message"></div>

    <!-- УПРАВЛЕНИЕ -->
    <div id="controls">

        <div id="pad">
            <button id="up" class="control">▲</button>

            <div class="pad-bottom">
                <button id="left" class="control">◀</button>
                <button id="down" class="control">▼</button>
                <button id="right" class="control">▶</button>
            </div>
        </div>

        <div id="actions">
            <button id="jump" class="action">JUMP</button>
            <button id="enter" class="action">F</button>
        </div>

    </div>

    <!-- ИГРОВЫЕ СКРИПТЫ -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
