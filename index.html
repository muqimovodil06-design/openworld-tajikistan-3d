
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEN WORLD TAJIKISTAN 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#title{
 position:absolute;top:12px;left:50%;transform:translateX(-50%);
 color:white;font-size:18px;font-weight:bold;
 text-shadow:2px 2px 5px #000;white-space:nowrap
}
#info{
 position:absolute;top:42px;left:10px;color:white;
 font-size:12px;text-shadow:1px 1px 4px #000
}
#controls{
 position:absolute;bottom:18px;left:12px;
 display:grid;grid-template-columns:58px 58px 58px;gap:5px
}
button{
 background:#101820bb;color:white;border:2px solid white;
 border-radius:12px;font-weight:bold;touch-action:none
}
#controls button{width:58px;height:58px;font-size:22px}
#up{grid-column:2}
#left{grid-column:1}
#down{grid-column:2}
#right{grid-column:3}
#actions{
 position:absolute;right:12px;bottom:20px;
 display:flex;flex-direction:column;gap:8px
}
#actions button{padding:13px 9px;font-size:12px}
#message{
 position:absolute;top:75px;left:50%;transform:translateX(-50%);
 color:white;text-shadow:1px 1px 4px black;font-size:13px
}
</style>
</head>
<body>
<div id="title">🇹🇯 OPEN WORLD TAJIKISTAN 3D</div>
<div id="info">WASD — движение | SPACE — прыжок | Мышь — обзор</div>
<div id="message">DUSHANBE CITY</div>

<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>
<div id="actions">
<button id="jump">ПРЫЖОК</button>
<button id="carBtn">СЕСТЬ В МАШИНУ</button>
<button id="exitCar">ВЫЙТИ</button>
<button id="dayBtn">ДЕНЬ / НОЧЬ</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ================= СЦЕНА =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9ed);
scene.fog = new THREE.Fog(0x8bc9ed, 120, 430);

const camera = new THREE.PerspectiveCamera(
 70, innerWidth/innerHeight, 0.1, 1200
);

const renderer = new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ================= СВЕТ =================
const hemi = new THREE.HemisphereLight(0xc9e7ff,0x59604b,1.8);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(100,160,80);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;
scene.add(sun);

// ================= МАТЕРИАЛЫ =================
const material = c => new THREE.MeshStandardMaterial({
 color:c,roughness:0.85
});

const grassMat=material(0x648b4b);
const roadMat=material(0x30343a);
const sidewalkMat=material(0xb8b6aa);
const whiteMat=material(0xffffff);
const windowMat=new THREE.MeshStandardMaterial({
 color:0x8fd5f5,metalness:0.25,roughness:0.25
});

// ================= ЗЕМЛЯ =================
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(900,900),grassMat
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ================= ДОРОГИ =================
function makeRoad(x,z,w,h){
 const r=new THREE.Mesh(
  new THREE.PlaneGeometry(w,h),roadMat
 );
 r.rotation.x=-Math.PI/2;
 r.position.set(x,.035,z);
 scene.add(r);
}
makeRoad(0,0,900,22);
makeRoad(0,0,22,900);
makeRoad(0,120,700,18);
makeRoad(120,0,18,700);
makeRoad(-120,0,18,700);
makeRoad(0,-120,700,18);

// Разметка
for(let i=-420;i<=420;i+=16){
 for(const z of [-5,5]){
  const line=new THREE.Mesh(
   new THREE.PlaneGeometry(7,.25),whiteMat
  );
  line.rotation.x=-Math.PI/2;
  line.position.set(i,.06,z);
  scene.add(line);
 }
}
for(let i=-420;i<=420;i+=16){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,7),whiteMat
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(5,.06,i);
 scene.add(line);
}

// ТРОТУАРЫ
function sidewalk(x,z,w,h){
 const o=new THREE.Mesh(
  new THREE.BoxGeometry(w,.25,h),sidewalkMat
 );
 o.position.set(x,.12,z);
 o.receiveShadow=true;
 scene.add(o);
}
sidewalk(0,14,900,3);
sidewalk(0,-14,900,3);
sidewalk(14,0,3,900);
sidewalk(-14,0,3,900);

// ================= ГОРОДСКИЕ ЗДАНИЯ =================
const buildingColors=[
 0xe0d4bd,0xd4c6ac,0xbec8ce,
 0xe7e0d1,0xc7b89e,0xd5d9d9
];

function building(x,z,w,d,h,color){
 const group=new THREE.Group();

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(color)
 );
 base.position.y=h/2;
 base.castShadow=true;
 base.receiveShadow=true;
 group.add(base);

 // Окна на фасаде
 for(let y=3;y<h-2;y+=5){
  for(let xx=-w/2+3;xx<w/2-1;xx+=4){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(1.7,2.2,.12),windowMat
   );
   win.position.set(xx,y,d/2+.07);
   group.add(win);
  }
 }

 // Крыша
 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(w+.5,.5,d+.5),material(0x777777)
 );
 roof.position.y=h+.2;
 group.add(roof);

 group.position.set(x,0,z);
 scene.add(group);
 return group;
}

// Районы города
for(let x=-280;x<=280;x+=42){
 for(let z=-280;z<=280;z+=42){
  if(Math.abs(x)<25 || Math.abs(z)<25)continue;
  if(Math.random()<.82){
   const w=14+Math.random()*12;
   const d=14+Math.random()*12;
   const h=10+Math.random()*35;
   const c=buildingColors[
    Math.floor(Math.random()*buildingColors.length)
   ];
   building(x,z,w,d,h,c);
  }
 }
}

// Высотные здания в центре
building(38,40,22,20,65,0xe1d3b9);
building(72,42,24,20,48,0xc6d0d7);
building(40,78,20,20,55,0xe8e1d2);
building(-42,42,24,20,42,0xd2c4ad);
building(-78,42,22,20,58,0xd5d9dc);
building(-42,-42,20,22,45,0xd8c6a7);

// ================= ГОРЫ =================
function mountain(x,z,r,h,color){
 const m=new THREE.Mesh(
  new THREE.ConeGeometry(r,h,6),
  material(color)
 );
 m.position.set(x,h/2,z);
 m.castShadow=true;
 scene.add(m);

 // Снежная вершина
 const snow=new THREE.Mesh(
  new THREE.ConeGeometry(r*.27,h*.28,6),
  material(0xf1f4f5)
 );
 snow.position.set(x,h*.82,z);
 scene.add(snow);
}

for(let i=0;i<50;i++){
 const x=(Math.random()-.5)*900;
 const z=-360-Math.random()*180;
 mountain(
  x,z,25+Math.random()*30,70+Math.random()*90,
  0x777b7d
 );
}
for(let i=0;i<30;i++){
 const x=(Math.random()-.5)*900;
 const z=360+Math.random()*120;
 mountain(x,z,25+Math.random()*25,65+Math.random()*70,0x777b7d);
}

// ================= ДЕРЕВЬЯ =================
function tree(x,z){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,3.5,8),
  material(0x79502d)
 );
 trunk.position.y=1.75;
 trunk.castShadow=true;
 g.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.5,8,7),
  material(0x28763b)
 );
 leaves.position.y=4.5;
 leaves.castShadow=true;
 g.add(leaves);

 g.position.set(x,0,z);
 scene.add(g);
}

// Парковые зоны
for(let i=0;i<130;i++){
 const x=(Math.random()-.5)*650;
 const z=(Math.random()-.5)*650;
 if(Math.abs(x)>20 && Math.abs(z)>20)tree(x,z);
}

// ================= ФОНАРИ =================
function lamp(x,z){
 const g=new THREE.Group();

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.18,7,8),
  material(0x444444)
 );
 pole.position.y=3.5;
 g.add(pole);

 const arm=new THREE.Mesh(
  new THREE.BoxGeometry(2,.15,.15),
  material(0x444444)
 );
 arm.position.set(.8,6.8,0);
 g.add(arm);

 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.3,8,8),
  new THREE.MeshBasicMaterial({color:0xffe5a0})
 );
 bulb.position.set(1.7,6.7,0);
 g.add(bulb);

 g.position.set(x,0,z);
 scene.add(g);
}
for(let i=-250;i<=250;i+=35){
 lamp(i,18);
 lamp(i,-18);
}

// ================= ИГРОК =================
const player=new THREE.Group();

const playerBody=new THREE.Mesh(
 new THREE.BoxGeometry(1,1.8,.7),material(0x2055d9)
);
playerBody.position.y=1.5;
playerBody.castShadow=true;
player.add(playerBody);

const playerHead=new THREE.Mesh(
 new THREE.SphereGeometry(.43,16,16),
 material(0xffc995)
);
playerHead.position.y=2.7;
playerHead.castShadow=true;
player.add(playerHead);

player.position.set(0,0,30);
scene.add(player);

// ================= МАШИНА =================
const car=new THREE.Group();

const chassis=new THREE.Mesh(
 new THREE.BoxGeometry(2.8,1,5),
 material(0xd51e20)
);
chassis.position.y=.9;
chassis.castShadow=true;
car.add(chassis);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(2.2,1.15,2.5),
 material(0x273e55)
);
cabin.position.set(0,1.85,-.3);
car.add(cabin);

for(const x of [-1.45,1.45]){
 for(const z of [-1.55,1.55]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.48,.48,.35,16),
   material(0x171717)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.5,z);
  car.add(wheel);
 }
}
car.position.set(5,0,30);
scene.add(car);

// ================= УПРАВЛЕНИЕ =================
const keys={};
let inCar=false;
let mouseX=0,mouseY=.25;
let cameraDistance=11;

document.addEventListener('keydown',e=>{
 keys[e.code]=true;
});
document.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}
bindButton('up','KeyW');
bindButton('down','KeyS');
bindButton('left','KeyA');
bindButton('right','KeyD');
bindButton('jump','Space');

// Камера мышкой
renderer.domElement.addEventListener('click',()=>{
 if(matchMedia('(pointer:fine)').matches){
  renderer.domElement.requestPointerLock();
 }
});
document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===renderer.domElement){
  mouseX-=e.movementX*.003;
  mouseY+=e.movementY*.003;
  mouseY=THREE.MathUtils.clamp(mouseY,-.45,.9);
 }
});
document.addEventListener('wheel',e=>{
 cameraDistance=THREE.MathUtils.clamp(
  cameraDistance+e.deltaY*.01,5,25
 );
});

// Сенсорный обзор пальцем
let touchX=null,touchY=null;
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===1){
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
 }
},{passive:true});

renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===1 && touchX!==null){
  const t=e.touches[0];
  const dx=t.clientX-touchX;
  const dy=t.clientY-touchY;
  mouseX-=dx*.006;
  mouseY+=dy*.004;
  mouseY=THREE.MathUtils.clamp(mouseY,-.45,.9);
  touchX=t.clientX;
  touchY=t.clientY;
 }
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>{
 touchX=null;touchY=null;
});

// Машина
document.getElementById('carBtn').onclick=()=>{
 if(!inCar){
  if(player.position.distanceTo(car.position)<12){
   inCar=true;
   player.visible=false;
   document.getElementById('message').textContent='ТЫ В МАШИНЕ';
  }else{
   document.getElementById('message').textContent='ПОДОЙДИ К МАШИНЕ';
  }
 }
};

document.getElementById('exitCar').onclick=()=>{
 if(inCar){
  inCar=false;
  player.position.copy(car.position);
  player.position.x+=4;
  player.visible=true;
  document.getElementById('message').textContent='DUSHANBE CITY';
 }
};

// День и ночь
let night=false;
document.getElementById('dayBtn').onclick=()=>{
 night=!night;
 scene.background.set(night?0x08162c:0x8bc9ed);
 scene.fog.color.copy(scene.background);
 sun.intensity=night?.35:2.4;
 hemi.intensity=night?.45:1.8;
};

// ================= ИГРОВАЯ ФИЗИКА =================
let velocityY=0;
let onGround=true;

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const delta=Math.min(clock.getDelta(),.04);
 const target=inCar?car:player;
 const speed=(inCar?22:9)*delta;

 let forward=0,side=0;
 if(keys.KeyW)forward=1;
 if(keys.KeyS)forward=-1;
 if(keys.KeyA)side=-1;
 if(keys.KeyD)side=1;

 const length=Math.hypot(forward,side);
 if(length>0){
  forward/=length;
  side/=length;

  const angle=mouseX;
  const dx=Math.sin(angle)*forward+Math.cos(angle)*side;
  const dz=Math.cos(angle)*forward-Math.sin(angle)*side;

  target.position.x+=dx*speed;
  target.position.z+=dz*speed;
  target.rotation.y=Math.atan2(dx,dz);
 }

 // Прыжок
 if(!inCar){
  if(keys.Space&&onGround){
   velocityY=12;
   onGround=false;
  }
  velocityY-=30*delta;
  player.position.y+=velocityY*delta;
  if(player.position.y<=0){
   player.position.y=0;
   velocityY=0;
   onGround=true;
  }
 }

 // Камера
 const follow=inCar?car:player;
 const horizontal=cameraDistance*Math.cos(mouseY);
 camera.position.set(
  follow.position.x+Math.sin(mouseX)*horizontal,
  follow.position.y+4+Math.sin(mouseY)*cameraDistance,
  follow.position.z+Math.cos(mouseX)*horizontal
 );
 camera.lookAt(
  follow.position.x,
  follow.position.y+1.5,
  follow.position.z
 );

 renderer.render(scene,camera);
}
animate();

// Размер экрана
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
